services:
  claude-proxy:
    image: node:20-alpine
    command: sh -c "npm install -g @anthropic-ai/claude-code claude-max-api-proxy && claude-max-api"
    volumes:
      - ~/.claude:/root/.claude:ro,z
    ports:
      - "3456:3456"
    restart: unless-stopped

  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./credentials.json:/app/credentials.json:z
      - ./token.json:/app/token.json:z
      - ./.env:/app/.env:z
    restart: unless-stopped

  openclaw-gateway:
    image: ghcr.io/openclaw/openclaw:latest
    volumes:
      - openclaw-config:/home/node/.openclaw
      - openclaw-auth:/home/node/.config/openclaw
      - ./openclaw-skill/job_tracker.md:/home/node/.openclaw/skills/job_tracker.md:z
      - ./openclaw-skill/openclaw.config.json5:/home/node/.openclaw/config.json5:z
      - ~/.claude/.credentials.json:/home/node/.claude/.credentials.json:ro,z
    environment:
      - OPENAI_API_KEY=not-needed
      - OPENAI_BASE_URL=http://claude-proxy:3456/v1
    ports:
      - "18789:18789"
    depends_on:
      - api
      - claude-proxy
    restart: unless-stopped

  openclaw-cli:
    image: ghcr.io/openclaw/openclaw:latest
    volumes:
      - openclaw-config:/home/node/.openclaw
      - openclaw-auth:/home/node/.config/openclaw
    environment:
      - OPENCLAW_GATEWAY_URL=ws://openclaw-gateway:18789
      - OPENCLAW_ALLOW_INSECURE_PRIVATE_WS=1
    depends_on:
      - openclaw-gateway
    profiles:
      - cli

volumes:
  openclaw-config:
  openclaw-auth:
